<rect class="box own" x="240" y="140" width="140" height="120" rx="3"/><path class="bar" d="M243 140 h134 a3 3 0 0 1 3 3 v19 h-140 v-19 a3 3 0 0 1 3 -3z"/><text class="t inv" x="310.0" y="155.5">api</text><text class="s" x="310.0" y="207.5">creates the</text><text class="s" x="310.0" y="220.5">session</text>
<rect class="box part" x="240" y="350" width="140" height="70" rx="3"/><text class="t" x="310.0" y="382.5">RabbitMQ</text><text class="s" x="310.0" y="396.5">work queue</text>
