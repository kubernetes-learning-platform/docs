<rect class="box part" x="50" y="90" width="120" height="70" rx="3"/><text class="t" x="110.0" y="122.5">Terminal</text><text class="s" x="110.0" y="136.5">you type</text>
<rect class="box part" x="50" y="270" width="120" height="90" rx="3"/><text class="t" x="110.0" y="306.0">Canvas</text><text class="s" x="110.0" y="320.0">draws only</text><text class="s" x="110.0" y="333.0">real state</text>
<rect class="box own" x="270" y="80" width="130" height="280" rx="3"/><path class="bar" d="M273 80 h124 a3 3 0 0 1 3 3 v19 h-130 v-19 a3 3 0 0 1 3 -3z"/><text class="t inv" x="335.0" y="95.5">api</text><text class="s" x="335.0" y="208.0">gives each</text><text class="s" x="335.0" y="221.0">message a</text><text class="s" x="335.0" y="234.0">number,</text><text class="s" x="335.0" y="247.0">saves it,</text><text class="s" x="335.0" y="260.0">then sends it</text>
<rect class="box own" x="470" y="80" width="110" height="280" rx="3"/><path class="bar" d="M473 80 h104 a3 3 0 0 1 3 3 v19 h-110 v-19 a3 3 0 0 1 3 -3z"/><text class="t inv" x="525.0" y="95.5">envmgr</text><text class="s" x="525.0" y="227.5">relays</text><text class="s" x="525.0" y="240.5">both ways</text>
<rect class="box own" x="660" y="90" width="130" height="70" rx="3"/><path class="bar" d="M663 90 h124 a3 3 0 0 1 3 3 v19 h-130 v-19 a3 3 0 0 1 3 -3z"/><text class="t inv" x="725.0" y="105.5">harness</text><text class="s" x="725.0" y="139.0">runs it</text>
<rect class="box part" x="840" y="170" width="110" height="100" rx="3"/><text class="t" x="895.0" y="217.5">k3d cluster</text><text class="s" x="895.0" y="231.5">really changes</text>
<rect class="box own" x="660" y="280" width="130" height="70" rx="3"/><path class="bar" d="M663 280 h124 a3 3 0 0 1 3 3 v19 h-130 v-19 a3 3 0 0 1 3 -3z"/><text class="t inv" x="725.0" y="295.5">harness</text><text class="s" x="725.0" y="329.0">watches</text>
<rect class="box part" x="270" y="390" width="130" height="60" rx="3"/><text class="t" x="335.0" y="417.5">helper</text><text class="s" x="335.0" y="431.5">optional</text>
<rect class="mask" x="182.6" y="111.0" width="74.8" height="18" rx="2"/>
<circle class="bar" cx="192.6" cy="120.0" r="8.5"/><text class="num" x="192.6" y="123.6">1</text>
<text class="l" x="230.0" y="123.6">command</text>
<rect class="mask" x="592.2" y="111.0" width="55.6" height="18" rx="2"/>
<circle class="bar" cx="602.2" cy="120.0" r="8.5"/><text class="num" x="602.2" y="123.6">2</text>
<text class="l" x="630.0" y="123.6">exec</text>
<rect class="mask" x="800.8" y="111.0" width="68.4" height="18" rx="2"/>
<circle class="bar" cx="810.8" cy="120.0" r="8.5"/><text class="num" x="810.8" y="123.6">3</text>
<text class="l" x="845.0" y="123.6">change</text>
<rect class="mask" x="804.0" y="301.0" width="62.0" height="18" rx="2"/>
<circle class="bar" cx="814.0" cy="310.0" r="8.5"/><text class="num" x="814.0" y="313.6">4</text>
<text class="l" x="845.0" y="313.6">watch</text>
<rect class="mask" x="592.2" y="301.0" width="55.6" height="18" rx="2"/>
<circle class="bar" cx="602.2" cy="310.0" r="8.5"/><text class="num" x="602.2" y="313.6">5</text>
<text class="l" x="630.0" y="313.6">diff</text>
